[project]
name = "ai-replication-study"
version = "0.1.0"
description = "Meta-study: AI (Claude Code) replicating ship fuel consumption ML research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tpot>=0.12.0",
    "xgboost>=1.7.0",
    "deap>=1.4.0",
    "stopit>=1.1.0",
    "update-checker>=0.18.0",
]

[project.optional-dependencies]
autogluon = ["autogluon>=1.0.0"]
paper = ["latexcodec>=2.0.0"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
]
